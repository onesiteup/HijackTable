<!DOCTYPE html>
<html>
    <head>
        <title>My Page</title>

    </head>
<body>

    <div class="container">
        <div class="row">

            <div class="col-3">
                <button onclick="updateData()">Set My Table</button>
            </div>
            <div class="col-3">
                <button onclick="updateFilter()">Set My Filter</button>
            </div>
            <div class="col-3">
                <button onclick="clearFilter()">Clear Filter</button>
            </div>
            <div class="col-3">
                <button onclick="resetTable()">Reset Table</button>
            </div>

            <input type="search" id="filter-input" placeholder="Enter filter value">
            <div id="table-12"></div>
            <div id="table-13"></div>

        </div>
    </div>

    <script src="./hijack-table.js"></script>
    <script src="script.js"></script>

</body>
</html>
